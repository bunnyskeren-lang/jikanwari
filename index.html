<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>時間割</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1f3a5f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="時間割">
    <link rel="stylesheet" href="style.css?v=10">
</head>

<body>
<header>
    <div class="header-top">
        <h1>時間割</h1>
        <button id="summary-toggle" class="credit-chip" aria-expanded="false">
            卒業 <strong id="total-credits">0</strong>/127 ▾
        </button>
    </div>
    <div id="summary" hidden></div>
    <div id="year-tabs" class="tabs"></div>
    <div id="quarter-tabs" class="tabs"></div>
</header>

<main id="main">
    <table id="timetable"></table>
    <section id="extra">
        <h2>時間外 <small>オンデマンドなど曜日・時限のない授業</small></h2>
        <div id="extra-list"></div>
        <button id="extra-add" class="add-button">＋ 時間外に追加</button>
    </section>
    <p class="hint">コマをタップして編集 ・ 左右にスワイプでクォーター切替</p>
    <div id="legend"></div>
</main>

<dialog id="cell-dialog">
    <form id="cell-form" method="dialog">
        <p id="dialog-slot"></p>
        <label>科目名
            <input id="dialog-subject" list="subject-list" autocomplete="off" enterkeyhint="next">
        </label>
        <p class="warning" id="dialog-warning" hidden></p>
        <datalist id="subject-list"></datalist>
        <div class="row">
            <label>教室<input id="dialog-room" autocomplete="off"></label>
            <label>教員<input id="dialog-teacher" autocomplete="off"></label>
        </div>
        <div class="row">
            <label>区分<select id="dialog-major"></select></label>
            <label>分類<select id="dialog-minor"></select></label>
            <label class="credits" id="dialog-credits-label">単位<input id="dialog-credits" type="number" min="0" step="0.5" inputmode="decimal"></label>
        </div>
        <label class="check failed-check" id="dialog-failed-label">
            <input id="dialog-failed" type="checkbox">
            この科目の単位を落とした（単位に数えない）
        </label>
        <label class="check" id="dialog-all-quarters-label">
            <input id="dialog-all-quarters" type="checkbox">
            この学年の1Q〜4Qすべてに入れる（空いているコマのみ）
        </label>
        <p class="note" id="dialog-note">区分と単位は同じ科目名のコマすべてに反映されます</p>
        <div class="dialog-buttons">
            <button type="button" id="dialog-clear" class="danger">空にする</button>
            <button type="button" id="dialog-cancel">閉じる</button>
            <button type="submit" id="dialog-save" class="primary">保存</button>
        </div>
    </form>
</dialog>

    <!-- ?v= を変えると、スマホに古いファイルが残っていても新しい版が読み込まれる -->
    <script src="seed.js?v=10"></script>
    <script src="script.js?v=10"></script>
</body>
</html>
